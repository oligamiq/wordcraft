name: Folivect layout continuation envelope
on:
  push:
    branches: [folivect/layout-continuation-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Native regression and envelope tests
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          export RUSTUP_TOOLCHAIN=1.98.1 CARGO_BUILD_JOBS=2
          cargo test --locked -p wordcraft-layout --features wire-layout-interned --lib continuation::tests:: -- --nocapture
          cargo test --locked -p wordcraft-layout --features wire-layout-interned --lib block_batched_layout_preserves_multipass_pagination_and_exact_wire
          cargo test --locked -p wordcraft-layout --features wire-layout-interned --lib wire::
          cargo test --locked -p wordcraft-layout --features wire-layout-interned --test wire_layout
